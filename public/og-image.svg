<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#262523"/>
      <stop offset="100%" style="stop-color:#1a1918"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#650CBE"/>
      <stop offset="100%" style="stop-color:#4A0A8F"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:rgba(101,12,190,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(101,12,190,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Top overline -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="13" font-weight="600"
        fill="#a0a0a0" letter-spacing="3" text-transform="uppercase">AGENȚIE DE PERFORMANCE MARKETING · BUCUREȘTI</text>

  <!-- ACE logo text -->
  <text x="60" y="155" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900"
        fill="#FFFFFF" letter-spacing="-2">ACE</text>
  <text x="185" y="155" font-family="Arial, sans-serif" font-size="64" font-weight="400"
        fill="rgba(255,255,255,0.65)" letter-spacing="-1">agency</text>

  <!-- Main headline -->
  <text x="60" y="250" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900"
        fill="#FFFFFF" letter-spacing="-1">Bugetul tău de ads,</text>
  <text x="60" y="308" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900"
        fill="#56151A" letter-spacing="-1">transformat în revenue</text>
  <text x="60" y="366" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900"
        fill="#FFFFFF" letter-spacing="-1">măsurabil.</text>

  <!-- Divider -->
  <line x1="60" y1="410" x2="560" y2="410" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Stats row -->
  <text x="60" y="460" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900"
        fill="#56151A">13.34×</text>
  <text x="60" y="488" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0" letter-spacing="2">ROAS ITMAR</text>

  <text x="230" y="460" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900"
        fill="#56151A">8.11×</text>
  <text x="230" y="488" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0" letter-spacing="2">ROAS AMORA</text>

  <text x="380" y="460" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900"
        fill="#56151A">-87%</text>
  <text x="380" y="488" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0" letter-spacing="2">CPL DOSENSE</text>

  <!-- CTA pill right side -->
  <rect x="780" y="480" width="360" height="60" rx="30" fill="url(#accent)"/>
  <text x="960" y="518" font-family="Arial, sans-serif" font-size="18" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">Programează analiza gratuită →</text>

  <!-- Right side big stat -->
  <text x="780" y="250" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="900"
        fill="rgba(101,12,190,0.15)" letter-spacing="-4">5.4M</text>
  <text x="780" y="310" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.4)"
        letter-spacing="2">RON REVENUE ATRIBUIT</text>

  <!-- URL bottom right -->
  <text x="1140" y="590" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0"
        text-anchor="end">aceads.co</text>
</svg>
